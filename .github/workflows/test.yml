# Runs on GitHub and on Gitea Actions, which reads .github/workflows too.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # A Gitea job container has no init, so the orphans of a command a test
      # kills stay zombies, and routr counts their process group as alive.
      # tini -s reaps them. GitHub's runners are VMs and don't need it.
      - run: $( [ "$(id -u)" = 0 ] || echo sudo ) apt-get update -qq && $( [ "$(id -u)" = 0 ] || echo sudo ) apt-get install -y -qq tini
      # Tests that need a herdr server skip when herdr is not on PATH.
      - run: tini -s -- go test -race ./...

  pi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # A test takes the repo's first commit as an old routr build.
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
